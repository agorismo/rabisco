name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências do bot
        run: npm ci
        working-directory: bot
      - name: Checar sintaxe do JavaScript
        run: |
          set -e
          for f in web/*.js bot/src/*.mjs bot/src/commands/*.mjs bot/src/lib/*.mjs; do
            case "$f" in
              *.mjs) node --check "$f" ;;
              *) cp "$f" "/tmp/$(basename "$f" .js).mjs" && node --check "/tmp/$(basename "$f" .js).mjs" ;;
            esac
          done
      - name: Procurar segredos óbvios
        run: |
          if grep -rEn --exclude-dir=node_modules --exclude-dir=.git \
            -e 'service_role' -e 'eyJhbGciOi[A-Za-z0-9_-]{20,}' -e 'discord(app)?\.com/api/webhooks/[0-9]+/' \
            web bot/src supabase/migrations; then
            echo "Possível segredo encontrado. Revise as linhas acima."; exit 1
          fi
